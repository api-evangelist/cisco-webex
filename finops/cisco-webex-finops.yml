meters:
  - name: webex_seat
    description: Per-host monthly subscription (Free / Meet / Suite / Enterprise).
    unit: seat-month
    aggregation: max
    dimensions:
      - tier
      - region
      - billing_term
  - name: pstn_minutes
    description: Webex Calling PSTN minutes (inbound / outbound) when the PSTN add-on is enabled.
    unit: minute
    aggregation: sum
    dimensions:
      - direction
      - geography
      - rate_zone
  - name: webex_devices
    description: Webex Devices (Desk, Board, Room) under DaaS or perpetual purchase.
    unit: device-month
    aggregation: max
    dimensions:
      - model
      - region
  - name: contact_center_concurrent_agents
    description: Webex Contact Center concurrent licensed agents (when bundled).
    unit: concurrent_agent
    aggregation: max
    dimensions:
      - tier
      - region
principles:
  - name: Visibility
    description: Use Webex Control Hub analytics, the Admin Audit / Usage APIs, and Cisco Smart Software
      Manager to observe seat activation, meeting minutes, and PSTN consumption.
  - name: Allocation
    description: Allocate Webex seats to cost centers via Control Hub user attributes; chargeback by
      department / location using usage analytics exports.
  - name: Optimization
    description: Right-size seat counts to active hosts, retire dormant accounts, choose annual over
      monthly billing where forecast is stable, and optimize PSTN rate zones.
  - name: Accountability
    description: Collaboration platform owner is accountable for Webex license forecasting, True
      Forward true-ups, and PSTN minute monitoring.
