description: FOCUS-aligned FinOps shape for Cisco Webex. Cost is driven by per-host SaaS subscriptions
  to the Webex Suite (Meetings, Messaging, Calling, Webinars) plus PSTN add-ons and optional Webex
  Contact Center / Devices. APIs are not separately metered.
notes: Per-host monthly prices vary by region and reseller; verify against https://www.webex.com/pricing.html
  before publishing concrete numbers.
sources:
  - https://www.webex.com/pricing.html
  - https://developer.webex.com
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
