        name: listadminauditeventcategories
        description: Cisco Webex List Admin Audit Event Categories
        call: admin-audit-events-admin-audit-events.listadminauditeventcategories
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/adminaudit/events
      name: adminaudit-events
      description: REST surface for adminAudit-events.
      operations:
      - method: GET
        name: listadminauditevents
        description: Cisco Webex List Admin Audit Events
        call: admin-audit-events-admin-audit-events.listadminauditevents
        with:
          orgId: rest.orgId
          from: rest.from
          to: rest.to
          actorId: rest.actorId
          eventCategories: rest.eventCategories
          max: rest.max
