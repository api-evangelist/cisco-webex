  - type: http
    namespace: admin-audit-events-admin-audit-events
    baseUri: https://webexapis.com/v1
    description: Cisco Webex Admin Audit Events API — Admin Audit Events business capability. Self-contained, no shared references.
    resources:
    - name: adminAudit-eventCategories
      path: /adminAudit/eventCategories
      operations:
      - name: listadminauditeventcategories
        method: GET
        description: Cisco Webex List Admin Audit Event Categories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: adminAudit-events
      path: /adminAudit/events
      operations:
      - name: listadminauditevents
        method: GET
        description: Cisco Webex List Admin Audit Events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orgId
          in: query
          type: string
          description: Organization ID to list events for.
          required: true
        - name: from
          in: query
          type: string
          description: Start date and time in ISO 8601 format.
          required: true
        - name: to
          in: query
          type: string
          description: End date and time in ISO 8601 format.
          required: true
        - name: actorId
          in: query
          type: string
          description: Filter by person ID who performed the action.
        - name: eventCategories
          in: query
          type: string
          description: Filter by event category.
        - name: max
          in: query
          type: integer
          description: Maximum number of events to return (default 100, max 200).
        - name: offset
          in: query
          type: integer
          description: Offset for pagination.
