naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex Admin Audit Events API — Admin Audit Events
  description: 'Cisco Webex Admin Audit Events API — Admin Audit Events. 2 operations. Lead operation: Cisco Webex List Admin
    Audit Event Categories. Self-contained Naftiko capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - Admin Audit Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
