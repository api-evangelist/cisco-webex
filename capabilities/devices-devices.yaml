naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex Devices API — Devices
  description: 'Cisco Webex Devices API — Devices. 5 operations. Lead operation: Cisco Webex List Devices. Self-contained
    Naftiko capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: devices-devices
    baseUri: https://webexapis.com/v1
    description: Cisco Webex Devices API — Devices business capability. Self-contained, no shared references.
    resources:
    - name: devices
      path: /devices
      operations:
      - name: listdevices
        method: GET
        description: Cisco Webex List Devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: personId
          in: query
          type: string
          description: Filter by person ID who owns the device.
        - name: workspaceId
          in: query
          type: string
          description: Filter by workspace ID where the device is assigned.
        - name: displayName
          in: query
          type: string
          description: Filter by device display name.
        - name: product
          in: query
          type: string
          description: Filter by device product name.
        - name: type
          in: query
          type: string
          description: Filter by device type.
        - name: tag
          in: query
          type: string
          description: Filter by device tag.
        - name: connectionStatus
          in: query
          type: string
          description: Filter by device connection status.
        - name: serial
          in: query
          type: string
          description: Filter by device serial number.
        - name: software
          in: query
          type: string
          description: Filter by software version.
        - name: upgradeChannel
          in: query
          type: string
          description: Filter by upgrade channel.
        - name: errorCode
          in: query
          type: string
          description: Filter by error code.
        - name: capability
          in: query
          type: string
          description: Filter by device capability.
        - name: permission
          in: query
          type: string
          description: Filter by device permission.
        - name: orgId
          in: query
          type: string
          description: Filter by organization ID.
        - name: start
          in: query
          type: integer
          description: Offset for pagination.
        - name: max
          in: query
          type: integer
          description: Maximum number of devices to return (default 100).
      - name: createdevice
        method: POST
        description: Cisco Webex Create a Device Activation Code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: devices-deviceId
      path: /devices/{deviceId}
      operations:
      - name: getdevicedetails
        method: GET
        description: Cisco Webex Get Device Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: deviceId
          in: path
          type: string
          description: Unique identifier for the device.
          required: true
      - name: updatedevice
        method: PUT
        description: Cisco Webex Update a Device
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: deviceId
          in: path
          type: string
          description: Unique identifier for the device.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletedevice
        method: DELETE
        description: Cisco Webex Delete a Device
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: deviceId
          in: path
          type: string
          description: Unique identifier for the device.
          required: true
    authentication:
      type: bearer
      token: '{{env.CISCO_WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: devices-devices-rest
    port: 8080
    description: REST adapter for Cisco Webex Devices API — Devices. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/devices
      name: devices
      description: REST surface for devices.
      operations:
      - method: GET
        name: listdevices
        description: Cisco Webex List Devices
        call: devices-devices.listdevices
        with:
          personId: rest.personId
          workspaceId: rest.workspaceId
          displayName: rest.displayName
          product: rest.product
          type: rest.type
          tag: rest.tag
          connectionStatus: rest.connectionStatus
          serial: rest.serial
          software: rest.software
          upgradeChannel: rest.upgradeChannel
          errorCode: rest.errorCode
          capability: rest.capability
          permission: rest.permission
          orgId: rest.orgId
          start: rest.start
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createdevice
        description: Cisco Webex Create a Device Activation Code
        call: devices-devices.createdevice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/devices/{deviceid}
      name: devices-deviceid
      description: REST surface for devices-deviceId.
      operations:
      - method: GET
        name: getdevicedetails
        description: Cisco Webex Get Device Details
        call: devices-devices.getdevicedetails
        with:
          deviceId: rest.deviceId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatedevice
        description: Cisco Webex Update a Device
        call: devices-devices.updatedevice
        with:
          deviceId: rest.deviceId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletedevice
        description: Cisco Webex Delete a Device
        call: devices-devices.deletedevice
        with:
          deviceId: rest.deviceId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: devices-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Webex Devices API — Devices. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: cisco-webex-list-devices
      description: Cisco Webex List Devices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devices-devices.listdevices
      with:
        personId: tools.personId
        workspaceId: tools.workspaceId
        displayName: tools.displayName
        product: tools.product
        type: tools.type
        tag: tools.tag
        connectionStatus: tools.connectionStatus
        serial: tools.serial
        software: tools.software
        upgradeChannel: tools.upgradeChannel
        errorCode: tools.errorCode
        capability: tools.capability
        permission: tools.permission
        orgId: tools.orgId
        start: tools.start
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-create-device-activation
      description: Cisco Webex Create a Device Activation Code
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: devices-devices.createdevice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-device-details
      description: Cisco Webex Get Device Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: devices-devices.getdevicedetails
      with:
        deviceId: tools.deviceId
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-update-device
      description: Cisco Webex Update a Device
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: devices-devices.updatedevice
      with:
        deviceId: tools.deviceId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-delete-device
      description: Cisco Webex Delete a Device
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: devices-devices.deletedevice
      with:
        deviceId: tools.deviceId
      outputParameters:
      - type: object
        mapping: $.
