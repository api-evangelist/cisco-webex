naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex Memberships API — Memberships
  description: 'Cisco Webex Memberships API — Memberships. 5 operations. Lead operation: Cisco Webex List Memberships. Self-contained
    Naftiko capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - Memberships
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: memberships-memberships
    baseUri: https://webexapis.com/v1
    description: Cisco Webex Memberships API — Memberships business capability. Self-contained, no shared references.
    resources:
    - name: memberships
      path: /memberships
      operations:
      - name: listmemberships
        method: GET
        description: Cisco Webex List Memberships
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roomId
          in: query
          type: string
          description: Filter memberships by room ID.
        - name: personId
          in: query
          type: string
          description: Filter memberships by person ID.
        - name: personEmail
          in: query
          type: string
          description: Filter memberships by person email address.
        - name: max
          in: query
          type: integer
          description: Maximum number of memberships to return (default 100).
      - name: createmembership
        method: POST
        description: Cisco Webex Create a Membership
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: memberships-membershipId
      path: /memberships/{membershipId}
      operations:
      - name: getmembershipdetails
        method: GET
        description: Cisco Webex Get Membership Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: membershipId
          in: path
          type: string
          description: Unique identifier for the membership.
          required: true
      - name: updatemembership
        method: PUT
        description: Cisco Webex Update a Membership
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: membershipId
          in: path
          type: string
          description: Unique identifier for the membership.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletemembership
        method: DELETE
        description: Cisco Webex Delete a Membership
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: membershipId
          in: path
          type: string
          description: Unique identifier for the membership.
          required: true
    authentication:
      type: bearer
      token: '{{env.CISCO_WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: memberships-memberships-rest
    port: 8080
    description: REST adapter for Cisco Webex Memberships API — Memberships. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/memberships
      name: memberships
      description: REST surface for memberships.
      operations:
      - method: GET
        name: listmemberships
        description: Cisco Webex List Memberships
        call: memberships-memberships.listmemberships
        with:
          roomId: rest.roomId
          personId: rest.personId
          personEmail: rest.personEmail
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createmembership
        description: Cisco Webex Create a Membership
        call: memberships-memberships.createmembership
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/memberships/{membershipid}
      name: memberships-membershipid
      description: REST surface for memberships-membershipId.
      operations:
      - method: GET
        name: getmembershipdetails
        description: Cisco Webex Get Membership Details
        call: memberships-memberships.getmembershipdetails
        with:
          membershipId: rest.membershipId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatemembership
        description: Cisco Webex Update a Membership
        call: memberships-memberships.updatemembership
        with:
          membershipId: rest.membershipId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletemembership
        description: Cisco Webex Delete a Membership
        call: memberships-memberships.deletemembership
        with:
          membershipId: rest.membershipId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: memberships-memberships-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Webex Memberships API — Memberships. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: cisco-webex-list-memberships
      description: Cisco Webex List Memberships
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: memberships-memberships.listmemberships
      with:
        roomId: tools.roomId
        personId: tools.personId
        personEmail: tools.personEmail
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-create-membership
      description: Cisco Webex Create a Membership
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: memberships-memberships.createmembership
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-membership-details
      description: Cisco Webex Get Membership Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: memberships-memberships.getmembershipdetails
      with:
        membershipId: tools.membershipId
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-update-membership
      description: Cisco Webex Update a Membership
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: memberships-memberships.updatemembership
      with:
        membershipId: tools.membershipId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-delete-membership
      description: Cisco Webex Delete a Membership
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: memberships-memberships.deletemembership
      with:
        membershipId: tools.membershipId
      outputParameters:
      - type: object
        mapping: $.
