naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex Roles API — Roles
  description: 'Cisco Webex Roles API — Roles. 2 operations. Lead operation: Cisco Webex List Roles. Self-contained Naftiko
    capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - Roles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: roles-roles
    baseUri: https://webexapis.com/v1
    description: Cisco Webex Roles API — Roles business capability. Self-contained, no shared references.
    resources:
    - name: roles
      path: /roles
      operations:
      - name: listroles
        method: GET
        description: Cisco Webex List Roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: roles-roleId
      path: /roles/{roleId}
      operations:
      - name: getroledetails
        method: GET
        description: Cisco Webex Get Role Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roleId
          in: path
          type: string
          description: Unique identifier for the role.
          required: true
    authentication:
      type: bearer
      token: '{{env.CISCO_WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: roles-roles-rest
    port: 8080
    description: REST adapter for Cisco Webex Roles API — Roles. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/roles
      name: roles
      description: REST surface for roles.
      operations:
      - method: GET
        name: listroles
        description: Cisco Webex List Roles
        call: roles-roles.listroles
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/roles/{roleid}
      name: roles-roleid
      description: REST surface for roles-roleId.
      operations:
      - method: GET
        name: getroledetails
        description: Cisco Webex Get Role Details
        call: roles-roles.getroledetails
        with:
          roleId: rest.roleId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: roles-roles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Webex Roles API — Roles. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: cisco-webex-list-roles
      description: Cisco Webex List Roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: roles-roles.listroles
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-role-details
      description: Cisco Webex Get Role Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: roles-roles.getroledetails
      with:
        roleId: tools.roleId
      outputParameters:
      - type: object
        mapping: $.
