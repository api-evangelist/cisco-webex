naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex People API — People
  description: 'Cisco Webex People API — People. 6 operations. Lead operation: Cisco Webex List People. Self-contained Naftiko
    capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - People
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: people-people
    baseUri: https://webexapis.com/v1
    description: Cisco Webex People API — People business capability. Self-contained, no shared references.
    resources:
    - name: people
      path: /people
      operations:
      - name: listpeople
        method: GET
        description: Cisco Webex List People
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: email
          in: query
          type: string
          description: Filter by email address. Only exact matches are returned.
        - name: displayName
          in: query
          type: string
          description: Filter by display name. Supports partial matching.
        - name: id
          in: query
          type: string
          description: Filter by person ID. Supports up to 85 IDs, comma-separated.
        - name: orgId
          in: query
          type: string
          description: Filter by organization ID.
        - name: callingData
          in: query
          type: boolean
          description: Include Webex Calling user details in the response.
        - name: locationId
          in: query
          type: string
          description: Filter by location ID for Webex Calling users.
        - name: max
          in: query
          type: integer
          description: Maximum number of people to return (default 100, max 1000).
      - name: createperson
        method: POST
        description: Cisco Webex Create a Person
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: callingData
          in: query
          type: boolean
          description: Include Webex Calling user details in the response.
        - name: minResponse
          in: query
          type: boolean
          description: Only return the person ID on success.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: people-me
      path: /people/me
      operations:
      - name: getmyowndetails
        method: GET
        description: Cisco Webex Get My Own Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: callingData
          in: query
          type: boolean
          description: Include Webex Calling user details in the response.
    - name: people-personId
      path: /people/{personId}
      operations:
      - name: getpersondetails
        method: GET
        description: Cisco Webex Get Person Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: personId
          in: path
          type: string
          description: Unique identifier for the person.
          required: true
        - name: callingData
          in: query
          type: boolean
          description: Include Webex Calling user details in the response.
      - name: updateperson
        method: PUT
        description: Cisco Webex Update a Person
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: personId
          in: path
          type: string
          description: Unique identifier for the person.
          required: true
        - name: callingData
          in: query
          type: boolean
          description: Include Webex Calling user details in the response.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteperson
        method: DELETE
        description: Cisco Webex Delete a Person
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: personId
          in: path
          type: string
          description: Unique identifier for the person.
          required: true
    authentication:
      type: bearer
      token: '{{env.CISCO_WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: people-people-rest
    port: 8080
    description: REST adapter for Cisco Webex People API — People. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/people
      name: people
      description: REST surface for people.
      operations:
      - method: GET
        name: listpeople
        description: Cisco Webex List People
        call: people-people.listpeople
        with:
          email: rest.email
          displayName: rest.displayName
          id: rest.id
          orgId: rest.orgId
          callingData: rest.callingData
          locationId: rest.locationId
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createperson
        description: Cisco Webex Create a Person
        call: people-people.createperson
        with:
          callingData: rest.callingData
          minResponse: rest.minResponse
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/people/me
      name: people-me
      description: REST surface for people-me.
      operations:
      - method: GET
        name: getmyowndetails
        description: Cisco Webex Get My Own Details
        call: people-people.getmyowndetails
        with:
          callingData: rest.callingData
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/people/{personid}
      name: people-personid
      description: REST surface for people-personId.
      operations:
      - method: GET
        name: getpersondetails
        description: Cisco Webex Get Person Details
        call: people-people.getpersondetails
        with:
          personId: rest.personId
          callingData: rest.callingData
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateperson
        description: Cisco Webex Update a Person
        call: people-people.updateperson
        with:
          personId: rest.personId
          callingData: rest.callingData
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteperson
        description: Cisco Webex Delete a Person
        call: people-people.deleteperson
        with:
          personId: rest.personId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: people-people-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Webex People API — People. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: cisco-webex-list-people
      description: Cisco Webex List People
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: people-people.listpeople
      with:
        email: tools.email
        displayName: tools.displayName
        id: tools.id
        orgId: tools.orgId
        callingData: tools.callingData
        locationId: tools.locationId
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-create-person
      description: Cisco Webex Create a Person
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: people-people.createperson
      with:
        callingData: tools.callingData
        minResponse: tools.minResponse
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-my-own
      description: Cisco Webex Get My Own Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: people-people.getmyowndetails
      with:
        callingData: tools.callingData
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-person-details
      description: Cisco Webex Get Person Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: people-people.getpersondetails
      with:
        personId: tools.personId
        callingData: tools.callingData
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-update-person
      description: Cisco Webex Update a Person
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: people-people.updateperson
      with:
        personId: tools.personId
        callingData: tools.callingData
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-delete-person
      description: Cisco Webex Delete a Person
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: people-people.deleteperson
      with:
        personId: tools.personId
      outputParameters:
      - type: object
        mapping: $.
