naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex Workspaces API — Workspaces
  description: 'Cisco Webex Workspaces API — Workspaces. 5 operations. Lead operation: Cisco Webex List Workspaces. Self-contained
    Naftiko capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - Workspaces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: workspaces-workspaces
    baseUri: https://webexapis.com/v1
    description: Cisco Webex Workspaces API — Workspaces business capability. Self-contained, no shared references.
    resources:
    - name: workspaces
      path: /workspaces
      operations:
      - name: listworkspaces
        method: GET
        description: Cisco Webex List Workspaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: displayName
          in: query
          type: string
          description: Filter by workspace display name.
        - name: workspaceLocationId
          in: query
          type: string
          description: Filter by workspace location ID.
        - name: floorId
          in: query
          type: string
          description: Filter by floor ID.
        - name: capacity
          in: query
          type: integer
          description: Filter by workspace capacity.
        - name: type
          in: query
          type: string
          description: Filter by workspace type.
        - name: callingType
          in: query
          type: string
          description: Filter by calling type.
        - name: calendarType
          in: query
          type: string
          description: Filter by calendar type.
        - name: orgId
          in: query
          type: string
          description: Filter by organization ID.
        - name: start
          in: query
          type: integer
          description: Offset for pagination.
        - name: max
          in: query
          type: integer
          description: Maximum number of workspaces to return (default 100).
      - name: createworkspace
        method: POST
        description: Cisco Webex Create a Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: workspaces-workspaceId
      path: /workspaces/{workspaceId}
      operations:
      - name: getworkspacedetails
        method: GET
        description: Cisco Webex Get Workspace Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: workspaceId
          in: path
          type: string
          description: Unique identifier for the workspace.
          required: true
      - name: updateworkspace
        method: PUT
        description: Cisco Webex Update a Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: workspaceId
          in: path
          type: string
          description: Unique identifier for the workspace.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteworkspace
        method: DELETE
        description: Cisco Webex Delete a Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: workspaceId
          in: path
          type: string
          description: Unique identifier for the workspace.
          required: true
    authentication:
      type: bearer
      token: '{{env.CISCO_WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: workspaces-workspaces-rest
    port: 8080
    description: REST adapter for Cisco Webex Workspaces API — Workspaces. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/workspaces
      name: workspaces
      description: REST surface for workspaces.
      operations:
      - method: GET
        name: listworkspaces
        description: Cisco Webex List Workspaces
        call: workspaces-workspaces.listworkspaces
        with:
          displayName: rest.displayName
          workspaceLocationId: rest.workspaceLocationId
          floorId: rest.floorId
          capacity: rest.capacity
          type: rest.type
          callingType: rest.callingType
          calendarType: rest.calendarType
          orgId: rest.orgId
          start: rest.start
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createworkspace
        description: Cisco Webex Create a Workspace
        call: workspaces-workspaces.createworkspace
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workspaces/{workspaceid}
      name: workspaces-workspaceid
      description: REST surface for workspaces-workspaceId.
      operations:
      - method: GET
        name: getworkspacedetails
        description: Cisco Webex Get Workspace Details
        call: workspaces-workspaces.getworkspacedetails
        with:
          workspaceId: rest.workspaceId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateworkspace
        description: Cisco Webex Update a Workspace
        call: workspaces-workspaces.updateworkspace
        with:
          workspaceId: rest.workspaceId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteworkspace
        description: Cisco Webex Delete a Workspace
        call: workspaces-workspaces.deleteworkspace
        with:
          workspaceId: rest.workspaceId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: workspaces-workspaces-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Webex Workspaces API — Workspaces. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: cisco-webex-list-workspaces
      description: Cisco Webex List Workspaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workspaces-workspaces.listworkspaces
      with:
        displayName: tools.displayName
        workspaceLocationId: tools.workspaceLocationId
        floorId: tools.floorId
        capacity: tools.capacity
        type: tools.type
        callingType: tools.callingType
        calendarType: tools.calendarType
        orgId: tools.orgId
        start: tools.start
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-create-workspace
      description: Cisco Webex Create a Workspace
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: workspaces-workspaces.createworkspace
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-workspace-details
      description: Cisco Webex Get Workspace Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workspaces-workspaces.getworkspacedetails
      with:
        workspaceId: tools.workspaceId
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-update-workspace
      description: Cisco Webex Update a Workspace
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: workspaces-workspaces.updateworkspace
      with:
        workspaceId: tools.workspaceId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-delete-workspace
      description: Cisco Webex Delete a Workspace
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: workspaces-workspaces.deleteworkspace
      with:
        workspaceId: tools.workspaceId
      outputParameters:
      - type: object
        mapping: $.
