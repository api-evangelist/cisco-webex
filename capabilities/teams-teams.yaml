naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex Teams API — Teams
  description: 'Cisco Webex Teams API — Teams. 5 operations. Lead operation: Cisco Webex List Teams. Self-contained Naftiko
    capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: teams-teams
    baseUri: https://webexapis.com/v1
    description: Cisco Webex Teams API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: teams
      path: /teams
      operations:
      - name: listteams
        method: GET
        description: Cisco Webex List Teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: max
          in: query
          type: integer
          description: Maximum number of teams to return (default 100).
      - name: createteam
        method: POST
        description: Cisco Webex Create a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: teams-teamId
      path: /teams/{teamId}
      operations:
      - name: getteamdetails
        method: GET
        description: Cisco Webex Get Team Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: path
          type: string
          description: Unique identifier for the team.
          required: true
      - name: updateteam
        method: PUT
        description: Cisco Webex Update a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: path
          type: string
          description: Unique identifier for the team.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteteam
        method: DELETE
        description: Cisco Webex Delete a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: path
          type: string
          description: Unique identifier for the team.
          required: true
    authentication:
      type: bearer
      token: '{{env.CISCO_WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: teams-teams-rest
    port: 8080
    description: REST adapter for Cisco Webex Teams API — Teams. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/teams
      name: teams
      description: REST surface for teams.
      operations:
      - method: GET
        name: listteams
        description: Cisco Webex List Teams
        call: teams-teams.listteams
        with:
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createteam
        description: Cisco Webex Create a Team
        call: teams-teams.createteam
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{teamid}
      name: teams-teamid
      description: REST surface for teams-teamId.
      operations:
      - method: GET
        name: getteamdetails
        description: Cisco Webex Get Team Details
        call: teams-teams.getteamdetails
        with:
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateteam
        description: Cisco Webex Update a Team
        call: teams-teams.updateteam
        with:
          teamId: rest.teamId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteteam
        description: Cisco Webex Delete a Team
        call: teams-teams.deleteteam
        with:
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: teams-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Webex Teams API — Teams. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: cisco-webex-list-teams
      description: Cisco Webex List Teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: teams-teams.listteams
      with:
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-create-team
      description: Cisco Webex Create a Team
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: teams-teams.createteam
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-team-details
      description: Cisco Webex Get Team Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: teams-teams.getteamdetails
      with:
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-update-team
      description: Cisco Webex Update a Team
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: teams-teams.updateteam
      with:
        teamId: tools.teamId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-delete-team
      description: Cisco Webex Delete a Team
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: teams-teams.deleteteam
      with:
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
