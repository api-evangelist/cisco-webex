naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex Webhooks API — Webhooks
  description: 'Cisco Webex Webhooks API — Webhooks. 5 operations. Lead operation: Cisco Webex List Webhooks. Self-contained
    Naftiko capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - Webhooks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: webhooks-webhooks
    baseUri: https://webexapis.com/v1
    description: Cisco Webex Webhooks API — Webhooks business capability. Self-contained, no shared references.
    resources:
    - name: webhooks
      path: /webhooks
      operations:
      - name: listwebhooks
        method: GET
        description: Cisco Webex List Webhooks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: max
          in: query
          type: integer
          description: Maximum number of webhooks to return (default 100).
        - name: ownedBy
          in: query
          type: string
          description: Filter webhooks by ownership. Set to 'org' for organization-level webhooks.
      - name: createwebhook
        method: POST
        description: Cisco Webex Create a Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: webhooks-webhookId
      path: /webhooks/{webhookId}
      operations:
      - name: getwebhookdetails
        method: GET
        description: Cisco Webex Get Webhook Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: webhookId
          in: path
          type: string
          description: Unique identifier for the webhook.
          required: true
      - name: updatewebhook
        method: PUT
        description: Cisco Webex Update a Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: webhookId
          in: path
          type: string
          description: Unique identifier for the webhook.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletewebhook
        method: DELETE
        description: Cisco Webex Delete a Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: webhookId
          in: path
          type: string
          description: Unique identifier for the webhook.
          required: true
    authentication:
      type: bearer
      token: '{{env.CISCO_WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: webhooks-webhooks-rest
    port: 8080
    description: REST adapter for Cisco Webex Webhooks API — Webhooks. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/webhooks
      name: webhooks
      description: REST surface for webhooks.
      operations:
      - method: GET
        name: listwebhooks
        description: Cisco Webex List Webhooks
        call: webhooks-webhooks.listwebhooks
        with:
          max: rest.max
          ownedBy: rest.ownedBy
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createwebhook
        description: Cisco Webex Create a Webhook
        call: webhooks-webhooks.createwebhook
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/webhooks/{webhookid}
      name: webhooks-webhookid
      description: REST surface for webhooks-webhookId.
      operations:
      - method: GET
        name: getwebhookdetails
        description: Cisco Webex Get Webhook Details
        call: webhooks-webhooks.getwebhookdetails
        with:
          webhookId: rest.webhookId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatewebhook
        description: Cisco Webex Update a Webhook
        call: webhooks-webhooks.updatewebhook
        with:
          webhookId: rest.webhookId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletewebhook
        description: Cisco Webex Delete a Webhook
        call: webhooks-webhooks.deletewebhook
        with:
          webhookId: rest.webhookId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: webhooks-webhooks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Webex Webhooks API — Webhooks. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: cisco-webex-list-webhooks
      description: Cisco Webex List Webhooks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: webhooks-webhooks.listwebhooks
      with:
        max: tools.max
        ownedBy: tools.ownedBy
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-create-webhook
      description: Cisco Webex Create a Webhook
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: webhooks-webhooks.createwebhook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-webhook-details
      description: Cisco Webex Get Webhook Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: webhooks-webhooks.getwebhookdetails
      with:
        webhookId: tools.webhookId
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-update-webhook
      description: Cisco Webex Update a Webhook
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: webhooks-webhooks.updatewebhook
      with:
        webhookId: tools.webhookId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-delete-webhook
      description: Cisco Webex Delete a Webhook
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: webhooks-webhooks.deletewebhook
      with:
        webhookId: tools.webhookId
      outputParameters:
      - type: object
        mapping: $.
