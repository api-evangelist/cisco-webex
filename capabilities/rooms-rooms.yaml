naftiko: 1.0.0-alpha2
info:
  label: Cisco Webex Rooms API — Rooms
  description: 'Cisco Webex Rooms API — Rooms. 6 operations. Lead operation: Cisco Webex List Rooms. Self-contained Naftiko
    capability covering one Cisco Webex business surface.'
  tags:
  - Cisco Webex
  - Rooms
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CISCO_WEBEX_API_KEY: CISCO_WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: rooms-rooms
    baseUri: https://webexapis.com/v1
    description: Cisco Webex Rooms API — Rooms business capability. Self-contained, no shared references.
    resources:
    - name: rooms
      path: /rooms
      operations:
      - name: listrooms
        method: GET
        description: Cisco Webex List Rooms
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: query
          type: string
          description: Filter rooms by team ID.
        - name: type
          in: query
          type: string
          description: Filter by room type.
        - name: orgPublicSpaces
          in: query
          type: boolean
          description: Show organization public spaces.
        - name: from
          in: query
          type: string
          description: Filter rooms made public after this date and time.
        - name: to
          in: query
          type: string
          description: Filter rooms made public before this date and time.
        - name: sortBy
          in: query
          type: string
          description: Sort order for the results.
        - name: max
          in: query
          type: integer
          description: Maximum number of rooms to return (default 100, max 1000).
      - name: createroom
        method: POST
        description: Cisco Webex Create a Room
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: rooms-roomId
      path: /rooms/{roomId}
      operations:
      - name: getroomdetails
        method: GET
        description: Cisco Webex Get Room Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roomId
          in: path
          type: string
          description: Unique identifier for the room.
          required: true
      - name: updateroom
        method: PUT
        description: Cisco Webex Update a Room
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roomId
          in: path
          type: string
          description: Unique identifier for the room.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteroom
        method: DELETE
        description: Cisco Webex Delete a Room
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roomId
          in: path
          type: string
          description: Unique identifier for the room.
          required: true
    - name: rooms-roomId-meetingInfo
      path: /rooms/{roomId}/meetingInfo
      operations:
      - name: getroommeetingdetails
        method: GET
        description: Cisco Webex Get Room Meeting Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roomId
          in: path
          type: string
          description: Unique identifier for the room.
          required: true
    authentication:
      type: bearer
      token: '{{env.CISCO_WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: rooms-rooms-rest
    port: 8080
    description: REST adapter for Cisco Webex Rooms API — Rooms. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/rooms
      name: rooms
      description: REST surface for rooms.
      operations:
      - method: GET
        name: listrooms
        description: Cisco Webex List Rooms
        call: rooms-rooms.listrooms
        with:
          teamId: rest.teamId
          type: rest.type
          orgPublicSpaces: rest.orgPublicSpaces
          from: rest.from
          to: rest.to
          sortBy: rest.sortBy
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createroom
        description: Cisco Webex Create a Room
        call: rooms-rooms.createroom
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/rooms/{roomid}
      name: rooms-roomid
      description: REST surface for rooms-roomId.
      operations:
      - method: GET
        name: getroomdetails
        description: Cisco Webex Get Room Details
        call: rooms-rooms.getroomdetails
        with:
          roomId: rest.roomId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateroom
        description: Cisco Webex Update a Room
        call: rooms-rooms.updateroom
        with:
          roomId: rest.roomId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteroom
        description: Cisco Webex Delete a Room
        call: rooms-rooms.deleteroom
        with:
          roomId: rest.roomId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/rooms/{roomid}/meetinginfo
      name: rooms-roomid-meetinginfo
      description: REST surface for rooms-roomId-meetingInfo.
      operations:
      - method: GET
        name: getroommeetingdetails
        description: Cisco Webex Get Room Meeting Details
        call: rooms-rooms.getroommeetingdetails
        with:
          roomId: rest.roomId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rooms-rooms-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Webex Rooms API — Rooms. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: cisco-webex-list-rooms
      description: Cisco Webex List Rooms
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rooms-rooms.listrooms
      with:
        teamId: tools.teamId
        type: tools.type
        orgPublicSpaces: tools.orgPublicSpaces
        from: tools.from
        to: tools.to
        sortBy: tools.sortBy
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-create-room
      description: Cisco Webex Create a Room
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rooms-rooms.createroom
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-room-details
      description: Cisco Webex Get Room Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rooms-rooms.getroomdetails
      with:
        roomId: tools.roomId
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-update-room
      description: Cisco Webex Update a Room
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rooms-rooms.updateroom
      with:
        roomId: tools.roomId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-delete-room
      description: Cisco Webex Delete a Room
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rooms-rooms.deleteroom
      with:
        roomId: tools.roomId
      outputParameters:
      - type: object
        mapping: $.
    - name: cisco-webex-get-room-meeting
      description: Cisco Webex Get Room Meeting Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rooms-rooms.getroommeetingdetails
      with:
        roomId: tools.roomId
      outputParameters:
      - type: object
        mapping: $.
