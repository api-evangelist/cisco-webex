capabilities:
  - id: cisco-webex.run-meetings
    name: Run Webex meetings
    description: >-
      Schedule, host, and manage Webex meetings, recordings, and
      transcripts.
    apis:
      - cisco-webex:webex-meetings-api
      - cisco-webex:webex-recordings-api
      - cisco-webex:webex-converged-recordings-api
  - id: cisco-webex.message-and-collaborate
    name: Message and collaborate
    description: >-
      Send messages, manage spaces and teams, and post adaptive cards
      across Webex collaboration.
    apis:
      - cisco-webex:webex-messaging-api
      - cisco-webex:webex-rooms-api
      - cisco-webex:webex-teams-api
      - cisco-webex:webex-attachment-actions-api
  - id: cisco-webex.manage-people
    name: Manage people and access
    description: >-
      Provision, update, and remove users, memberships, and team
      memberships across Webex organizations.
    apis:
      - cisco-webex:webex-people-api
      - cisco-webex:webex-memberships-api
      - cisco-webex:webex-team-memberships-api
      - cisco-webex:webex-roles-api
      - cisco-webex:webex-licenses-api
  - id: cisco-webex.subscribe-events
    name: Subscribe to events
    description: >-
      Register webhooks and access activity events for compliance and
      automation.
    apis:
      - cisco-webex:webex-webhooks-api
      - cisco-webex:webex-events-api
  - id: cisco-webex.administer-organization
    name: Administer Webex organization
    description: >-
      Audit administrative actions, manage organizations, and inventory
      workspaces and devices.
    apis:
      - cisco-webex:webex-organizations-api
      - cisco-webex:webex-admin-audit-events-api
      - cisco-webex:webex-workspaces-api
      - cisco-webex:webex-devices-api
  - id: cisco-webex.control-calls
    name: Control voice calls
    description: >-
      Initiate, answer, hold, transfer, and end calls programmatically
      via Webex Calling.
    apis:
      - cisco-webex:webex-call-controls-api
