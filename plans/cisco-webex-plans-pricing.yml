description: Webex offers a tiered SaaS subscription model centered on the Webex Suite (Meetings,
  Messaging, Calling, Webinars). Plans range from a free tier through per-host SaaS subscriptions and
  custom Webex Enterprise / Contact Center agreements. The Webex for Developers REST APIs are not
  separately metered — API access is governed by the parent Webex subscription and the documented
  rate-limit policy.
notes: Webex pricing pages were not directly retrievable via WebFetch at reconciliation time; per-host
  prices below reference the official pricing page rather than embedding numeric quotes that could go
  stale. Verify against https://www.webex.com/pricing.html before publishing.
