      - name: Webex Events API
      - name: Webex Recordings API
      - name: Webex Call Controls API
      - name: Webex Attachment Actions API
      - name: Webex Organizations API
      - name: Webex Licenses API
      - name: Webex Roles API
      - name: Webex Workspaces API
      - name: Webex Admin Audit Events API
      - name: Webex Converged Recordings API
  - id: cisco-webex-enterprise
    name: Enterprise
    type: enterprise
    description: Custom-negotiated tier for Cisco Webex. Includes dedicated capacity, contractual SLAs,
      security review, data residency options, and named technical account management.
    entries:
      - label: API Requests
        description: Negotiated request volume; -1 indicates uncapped subject to fair use
        name: api_requests
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: configurable
        domains:
          - https://webexapis.com/v1
        unit: 1
        price: custom
        userMultiplied: false
