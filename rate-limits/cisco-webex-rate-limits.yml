specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Cisco Webex
providerId: cisco-webex
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Collaboration
  - Video Conferencing
  - Messaging
  - Rate Limiting
description: Webex for Developers enforces dynamic rate limits on its REST APIs. Limits are scoped per
  application and per organization, vary by endpoint family (Messaging, Meetings, Admin, xAPI), and
  return HTTP 429 with a Retry-After header when exceeded. Webex publishes guidance on backoff and
  on requesting a higher limit through Cisco support.
notes: Webex does not publish a single per-second number; specific thresholds vary per endpoint and
  may be raised on request. Verify per-endpoint guidance under the Webex for Developers Basics docs
  before quoting fixed numbers.
sources:
  - https://developer.webex.com/docs/basics
  - https://developer.webex.com/docs/api/v1
headers:
  retryAfter: Retry-After
  trackingId: Trackingid
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Default REST API limit
    scope: app/organization
    metric: varies
    limit: see Webex for Developers Basics; per-endpoint dynamic limits
  - name: Bot / integration messaging limit
    scope: app/bot
    metric: varies
    limit: see Webex for Developers Basics; messaging endpoints have stricter caps to prevent spam
  - name: Admin / Control Hub APIs
    scope: organization
    metric: varies
    limit: see Webex for Developers Basics
policies:
  - name: Backoff Strategy
    description: On HTTP 429, honor the Retry-After response header and apply exponential backoff with
      jitter before retrying. Do not retry without delay.
  - name: Trackingid for support
    description: Include the Trackingid response header value when contacting Cisco support to raise
      a limit or investigate throttling.
  - name: Limit increase request
    description: Production integrations that need higher throughput can request a limit increase via
      Webex Developer Support.
  - name: Pagination and webhooks
    description: Use webhooks and pagination instead of polling — large list endpoints are explicitly
      throttled to encourage event-driven access patterns.
maintainers:
